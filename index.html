<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aashish Tamang | Official Website</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #1E1E32;
            --bg-darker: #18182B;
            --accent: #FF6B6B;
            --accent-soft: rgba(255, 107, 107, 0.15);
            --text-white: #FFFFFF;
            --text-gray: #B8B8D1;
            --btn-pink: #FF4757;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(30, 30, 50, 0.85);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        .nav-links a {
            color: var(--text-white);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 5%;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            flex: 1;
            max-width: 600px;
            z-index: 2;
        }

        .social-links {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .social-links a {
            width: 40px;
            height: 40px;
            border: 1px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background-color: var(--accent);
            color: white;
            transform: translateY(-3px);
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-gray);
            margin-bottom: 2.5rem;
            max-width: 450px;
        }

        .hero-buttons {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .btn-primary {
            padding: 0.9rem 2rem;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
        }

        .btn-play {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-white);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .btn-play-icon {
            width: 45px;
            height: 45px;
            background-color: var(--btn-pink);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .hero-image {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
        }

        .hero-img {
            width: 420px;
            height: auto;
            border-radius: 12px;
            object-fit: cover;
            z-index: 2;
        }

        .bg-text {
            position: absolute;
            right: 5%;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.03);
            pointer-events: none;
            z-index: 1;
        }

        /* Services Section */
        .services {
            padding: 5rem 5%;
            text-align: center;
        }

        .section-subtitle {
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 3rem;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .nav-links {
                gap: 1.5rem;
            }
            .hero h1 {
                font-size: 2.5rem;
            }
            .hero-img {
                width: 320px;
            }
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: var(--bg-darker);
                flex-direction: column;
                padding: 2rem;
                display: none;
            }
            .nav-links.active {
                display: flex;
            }
            .hero {
                flex-direction: column;
                text-align: center;
                padding-top: 100px;
            }
            .hero-content {
                max-width: 100%;
            }
            .social-links {
                justify-content: center;
            }
            .hero-buttons {
                justify-content: center;
            }
            .hero-image {
                justify-content: center;
                margin-top: 3rem;
            }
            .bg-text {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="#" class="logo">aashish<span>.</span>dev</a>
        <ul class="nav-links" id="navLinks">
            <li><a href="#home" class="active">Home</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#portfolio">Portfolio</a></li>
            <li><a href="#blog">Blog</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <div class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="hero-content">
            <!-- Social Icons -->
            <div class="social-links">
                <a href="https://facebook.com/aashishtamang22" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="https://github.com/aashishtmg" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://youtube.com/channel/UCQBbNY-PuigyaiRQ9F-NeYg" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-youtube"></i>
                </a>
            </div>

            <h1>I am <span>Aashish Tamang</span></h1>
            <p>I'm Aashish, a passionate programmer & developer with a strong drive to build creative digital solutions.</p>
            
            <div class="hero-buttons">
                <a href="#portfolio" class="btn-primary">My Portfolio</a>
                <a href="#about" class="btn-play">
                    <span class="btn-play-icon"><i class="fas fa-play"></i></span>
                </a>
            </div>
        </div>

        <div class="hero-image">
            <img src="aashishtamang.jpg" alt="Aashish Tamang" class="hero-img" />
            <div class="bg-text">Aashish</div>
        </div>
    </section>

    <!-- Services Section -->
    <section class="services" id="services">
        <p class="section-subtitle">Services</p>
        <h2 class="section-title">What I Do</h2>
        <!-- You can add service cards here easily -->
    </section>

    <script>
        // Mobile Menu Toggle
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');
        
        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Active link highlighting
        const sections = document.querySelectorAll('section');
        const navLinkItems = document.querySelectorAll('.nav-links a');

        window.addEventListener('scroll', () => {
            let current = '';
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (pageYOffset >= sectionTop - 200) {
                    current = section.getAttribute('id');
                }
            });

            navLinkItems.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === `#${current}`) {
                    link.classList.add('active');
                }
            });
        });
    </script>

</body>
</html>
